name: Release macOS

on:
  push:
    branches: [deployments]
  workflow_dispatch:

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'opnay/overseer' && (github.ref == 'refs/heads/deployments' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3.1.2
        with:
          version: 11.24.0
          runtime: node@26.3.1
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-arm64
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.ci
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
          pnpm runtime set bun 1.4.4 --global
      - name: Prepare release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node --input-type=module -e 'import { sourceVersion } from "./scripts/release.ts"; console.log(sourceVersion(process.cwd()))')
          TAG="v$VERSION"
          if gh release view "$TAG" --repo opnay/overseer >/dev/null 2>&1; then
            echo "Release already exists; inspect it before retrying: $TAG" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src -C strip=debuginfo" >> "$GITHUB_ENV"
          DELIMITER=$(openssl rand -hex 16)
          echo "notes<<$DELIMITER" >> "$GITHUB_OUTPUT"
          cat "docs/releases/$VERSION.md" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/overseer-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple.p12"
          chmod 600 "$RUNNER_TEMP/apple.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/apple.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/apple.p12"
      - name: Build, notarize and upload draft with Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          tauriScript: node scripts/tauri-release-ci.ts
          args: --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: ${{ steps.source.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
      - name: Verify draft assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -f latest.json; then
            mv latest.json "$RUNNER_TEMP/tauri-latest.json"
          fi
          node scripts/publish-release-ci.ts
      - name: Remove temporary signing material
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          if test -f "$RUNNER_TEMP/overseer-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/overseer-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/apple.p12"
