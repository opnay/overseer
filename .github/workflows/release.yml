name: Release macOS

on:
  push:
    branches: [deployments]
  workflow_dispatch:

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'opnay/overseer' && (github.ref == 'refs/heads/deployments' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.1
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@opnay"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-arm64
      - name: Install dependencies and check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
          pnpm check
      - name: Prepare release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node --input-type=module -e 'import { sourceVersion } from "./scripts/release.ts"; console.log(sourceVersion(process.cwd()))')
          TAG="v$VERSION"
          if gh release view "$TAG" --repo opnay/overseer >/dev/null 2>&1; then
            echo "Release already exists; inspect it before retrying: $TAG" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Import signing certificate and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/overseer-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple.p12"
          chmod 600 "$RUNNER_TEMP/apple.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/apple.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials overseer-notary --keychain "$KEYCHAIN_PATH" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
          rm "$RUNNER_TEMP/apple.p12"
      - name: Build, sign, notarize and verify
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src -C strip=debuginfo"
          pnpm release:build "docs/releases/$RELEASE_VERSION.md"
          node scripts/verify-release-privacy.ts src-tauri/target/release/bundle/macos/Overseer.app
          pnpm release:verify
      - name: Preserve verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: overseer-${{ env.RELEASE_VERSION }}-aarch64
          path: |
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/*.dmg
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/*.tar.gz
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/*.sig
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/*.json
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/*.md
            src-tauri/target/release/release-assets/v${{ env.RELEASE_VERSION }}/aarch64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "refs/tags/$RELEASE_TAG"
          pnpm release:publish
      - name: Remove temporary signing material
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          if test -f "$RUNNER_TEMP/overseer-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/overseer-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/apple.p12"
