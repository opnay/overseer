name: Check

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3.1.2
        with:
          version: 11.24.0
          runtime: node@26.3.1
          cache: true
          install: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.ci
        run: |
          pnpm install --frozen-lockfile
      - run: pnpm check
