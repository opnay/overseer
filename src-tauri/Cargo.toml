[package]
name = "overseer-desktop"
version = "0.1.0"
description = "A local Docker and Lima control plane"
authors = ["opnay"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "overseer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
