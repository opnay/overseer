[package]
name = "overseer-desktop"
version = "0.0.2"
description = "A local Docker and Lima control plane"
authors = ["opnay"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "overseer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
auto-launch = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSEvent",
  "NSWindow",
  "NSCell",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
